[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aclient"
version = "0.1.0"
description = "Async LLM client with concurrency control, retries, and recoverable batch state"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tqdm>=4.66.0"]

[project.optional-dependencies]
openai = ["openai>=1.30.0"]
test = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["aclient*"]
