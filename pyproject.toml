[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrunner"
version = "0.1.0"
description = "Async LLM runner with concurrency control, retries, and recoverable batch state"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.30.0", "tqdm>=4.66.0"]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["llmrunner*"]
